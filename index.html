<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/index.js" defer></script>
  
  <title>My My own Drawbox</title>
</head>
<body>
  <section>
    <h1>My Drawbox</h1>
    <div class="canvas-wrapper">
      <canvas id="drawboxcanvas" height="400px" width="400px"></canvas>
    </div>
    <fieldset id="controls">
      <div>
        <label for="colorpicker">Color Picker: </label>
        <input type="color" name="colorpicker" id="colorpicker" />
        <output name="colorchoice" id="colorchoice" for="colorpicker">black</output>
      </div>
      <div>
        <label for="palette">Color Palette: </label>
        <select name="palette" id="palette">
          <option value="Basic">Basic</option>
          <option value="FieryOcean">Fiery Ocean</option>
          <option value="PastelDreamlandAdventure">Pastel Dreamland Adventure</option>
          <option value="LightSteel">Light Steel</option>
        </select>
      </div>
      <!-- COLOR PALETTES  -->
      <div id="paletteswrapper">
        <!-- space for selected palette  -->
      </div>
      <!-- stroke size slider  -->
      <div>
      <label for="strokesize">Stroke Size: </label>
      <input type="range" name="strokesize" id="strokesize" title="stroke width" min="1" max="100" value="2" >
      <output name="strokeamount" id="strokeamount" for="strokesize">2</output>
    </div>
      <!-- opacity slider  -->
      <div>
      <label for="opacity">Opacity Level: </label>
      <input type="range" name="opacity" id="opacity" title="opacity level" min="0" max="1" step="0.01" value="1" >
      <output name="opacityamount" id="opacityamount" for="opacity">1</output>
    </div>
    <!-- brush type   -->
    <div>
    <label for="brushtype">Brush Type: </label>
    <select name="brushtype" id="brushtype">
      <option value="round">Round</option>
      <option value="bevel">Bevel</option>
      <option value="milter">Milter</option>
    </select>
    </div>
    <!-- line cap  -->
    <div>
      <label for="linecap">Line Cap: </label>
      <select name="linecap" id="linecap">
        <option value="round">Round</option>
        <option value="butt">Butt</option>
        <option value="square">Square</option>
      </select>
    </div>
    <!-- name  -->
    <div>
      <label for="Name">Name: </label>
      <input type="text" id="name" name="name" maxlength="30">
    </div>
    <!-- buttons  -->
    <div>
      <button id="undobutton" title="you can also do crtl+z">Undo</button>
      <button id="clearbutton" title="clear button">Clear</button>
      <button id="downloadbutton" title="download button">Download</button>
      <button id="submitbutton">Submit drawing</button>
    </div>
    </fieldset>

    <!-- Gallery  -->
     <div id="gallery"></div>
  </section>

</body>
</html>
